<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Deep Analytics // OmniTrack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand"><i class="fa-solid fa-bolt"></i><span>OmniTrack</span></div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Übersicht</a></li>
        <li><a href="creator.html" class="nav-link"><i class="fa-solid fa-user-astronaut"></i> Creator Lookup</a></li>
        <li><a href="analytics.html" class="nav-link active"><i class="fa-solid fa-chart-line"></i> Deep Analytics</a></li>
        <li><a href="settings.html" class="nav-link"><i class="fa-solid fa-key"></i> API Settings</a></li>
      </ul>
    </div>
    <div class="api-badge" id="global-api-badge"></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Deep Performance Matrix</h1>
        <p>Erweiterte Metriken & Radar-Analysen</p>
      </div>
    </div>

    <div class="charts-grid-2">
      <div class="card">
        <h3 style="margin-bottom: 16px;">Creator Score Radar</h3>
        <canvas id="radarChart" height="180"></canvas>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 16px;">Historische Entwicklung</h3>
        <canvas id="growthChart" height="180"></canvas>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
