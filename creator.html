<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Creator Lookup // OmniTrack</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <aside class="sidebar">
    <div>
      <div class="brand"><i class="fa-solid fa-bolt"></i><span>OmniTrack</span></div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Übersicht</a></li>
        <li><a href="creator.html" class="nav-link active"><i class="fa-solid fa-user-astronaut"></i> Creator Lookup</a></li>
        <li><a href="analytics.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Deep Analytics</a></li>
        <li><a href="settings.html" class="nav-link"><i class="fa-solid fa-key"></i> API Settings</a></li>
      </ul>
    </div>
    <div class="api-badge" id="global-api-badge"></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Creator Live Lookup</h1>
        <p>Echtzeitabfrage über YouTube, TikTok & Instagram</p>
      </div>
    </div>

    <!-- Live Search -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Channel-Name oder Handle (z. B. MrBeast, MontanaBlack)...">
      <button class="btn" id="search-btn" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i> Analysieren</button>
    </div>

    <!-- Live Profil Banner -->
    <div class="profile-banner">
      <img id="profile-avatar" src="" alt="Avatar" class="profile-avatar">
      <div>
        <h2 id="profile-name">-</h2>
        <p id="profile-handle" style="color: var(--accent); font-weight: 500;">-</p>
        <p id="profile-desc" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;"></p>
      </div>
    </div>

    <div class="charts-grid-2">
      <div class="card">
        <h3 style="margin-bottom: 16px;">Wachstumsverlauf</h3>
        <canvas id="growthChart" height="150"></canvas>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 16px;">Plattform-Verteilung</h3>
        <canvas id="distributionChart" height="150"></canvas>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
