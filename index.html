<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OmniTrack // Social Media Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <i class="fa-solid fa-bolt"></i>
        <span>OmniTrack</span>
      </div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link active"><i class="fa-solid fa-chart-pie"></i> Übersicht</a></li>
        <li><a href="creator.html" class="nav-link"><i class="fa-solid fa-user-astronaut"></i> Creator Lookup</a></li>
        <li><a href="analytics.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Deep Analytics</a></li>
        <li><a href="settings.html" class="nav-link"><i class="fa-solid fa-key"></i> API Settings</a></li>
      </ul>
    </div>

    <div class="api-badge" id="global-api-badge">
      <span class="dot yellow"></span> Demo Mode
    </div>
  </aside>

  <!-- Content -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Übersicht</h1>
        <p>Zentralisiertes Multi-Channel Performance Monitoring</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="card">
        <div class="card-title">Follower Gesamt <i class="fa-solid fa-users"></i></div>
        <div class="card-value" id="kpi-followers">-</div>
        <div class="card-trend"><i class="fa-solid fa-arrow-trend-up"></i> +14.2% dieser Monat</div>
      </div>
      <div class="card">
        <div class="card-title">Views Gesamt <i class="fa-solid fa-eye"></i></div>
        <div class="card-value" id="kpi-views">-</div>
        <div class="card-trend"><i class="fa-solid fa-arrow-trend-up"></i> +28.5% Growth</div>
      </div>
      <div class="card">
        <div class="card-title">Ø Engagement Rate <i class="fa-solid fa-fire"></i></div>
        <div class="card-value" id="kpi-engagement">-</div>
        <div class="card-trend"><i class="fa-solid fa-check"></i> Über Benchmark</div>
      </div>
    </div>

    <div class="charts-grid-2">
      <div class="card">
        <h3 style="margin-bottom: 16px;">Plattform-Wachstum</h3>
        <canvas id="growthChart" height="140"></canvas>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 16px;">Audience Split</h3>
        <canvas id="distributionChart" height="140"></canvas>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
